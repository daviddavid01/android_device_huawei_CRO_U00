name: Build HUAWEI CRO-U00 Kernel

on:
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-20.04
    
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: device/huawei/CRO_U00

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
          gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
          zip zlib1g-dev python-is-python3 python3

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize LineageOS 13.0 Source
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        mkdir android-src
        cd android-src
        repo init -u https://github.com -b cm-13.0 --git-lfs --depth=1

    - name: Sync Minimal Build Tree
      run: |
        cd android-src
        # Syncing only essential build platforms to save GitHub Runner space and time
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags \
          build/make prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9

    - name: Set Up Workspace
      run: |
        # Link the checked-out device tree into the build structure
        mkdir -p android-src/device/huawei/
        mv device/huawei/CRO_U00 android-src/device/huawei/CRO_U00

    - name: Compile Boot Image / Kernel
      run: |
        cd android-src
        source build/envsetup.sh
        lunch lineage_CRO_U00-userdebug
        # Target 'bootimage' forces compilation of the kernel via kernel.mk
        make -j$(nproc --all) bootimage

    - name: Upload Compiled Kernel Artifacts
      uses: actions/artifacts@v4
      with:
        name: huawei-cro_u00-kernel-boot
        path: |
          android-src/out/target/product/CRO_U00/boot.img
          android-src/out/target/product/CRO_U00/obj/KERNEL_OBJ/arch/arm/boot/zImage
