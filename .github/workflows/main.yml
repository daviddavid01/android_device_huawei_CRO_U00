name: Build HUAWEI CRO-U00 Kernel

on:
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Run modern actions on the modern host runner FIRST
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: device/huawei/CRO_U00

    # 2. Run your workspace synchronization out on the host
    - name: Sync Source Tree on Host
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # Download modern repo tool for syncing
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH="$HOME/bin:$PATH"
        
        mkdir android-src
        cd android-src
        repo init -u https://github.com -b cm-13.0 --git-lfs --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags \
          build/make prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9
          
        # Move device tree into source matrix
        mkdir -p device/huawei/
        mv ../device/huawei/CRO_U00 device/huawei/CRO_U00

    # 3. Pull an Ubuntu 16.04 image and mount your files into it for the 2015 compilation
    - name: Compile 2015 Kernel inside Legacy Container
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/android-src \
          ubuntu:16.04 /bin/bash -c "
            # Set non-interactive for apt
            export DEBIAN_FRONTEND=noninteractive
            
            # Install 2015 compiler dependencies inside the container
            apt-get update && apt-get install -y \
              bc bison build-essential ccache curl flex g++-multilib \
              gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
              lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
              libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
              zip zlib1g-dev python python-crypto libcrypto++-dev libncurses5:i386
            
            # Compile using legacy toolchain flags
            source build/envsetup.sh
            lunch lineage_CRO_U00-userdebug
            make -j\$(nproc --all) bootimage
          "
